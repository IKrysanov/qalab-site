<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QALab — вход выполнен</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;background:#EFEEE9;color:#141414}
code{display:block;word-break:break-all;background:#fff;border:1px solid #ccc;padding:12px;border-radius:8px}
button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#F25C1F;color:#fff;font-weight:600}</style></head>
<body><h1>QALab · вход выполнен</h1>
<p>Скопируйте адрес этой страницы и выполните в проекте:</p>
<code id="cmd"></code><button onclick="navigator.clipboard.writeText(document.getElementById('cmd').textContent)">Скопировать команду</button>
<p>Страница ничего не отправляет и не сохраняет: код входа остаётся только в адресной строке вашего браузера.</p>
<script>
const p = new URLSearchParams(location.search);
const plat = location.pathname.includes("tiktok") || p.get("scopes") ? "tiktok" : (p.get("code") && p.get("code").startsWith("AQ") ? "instagram" : "<площадка>");
document.getElementById("cmd").textContent = `.venv/bin/python -m publish auth ${plat} --code "${location.href}"`;
</script></body></html>
